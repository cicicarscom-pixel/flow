name: CI
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Check BOM
        run: bash scripts/ci/check-bom.sh
      - name: Check Names
        run: bash scripts/ci/check-names.sh
